<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 400' width='600' height='400'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='100%' stop-color='#1a2a6c'/>
    </linearGradient>
    <linearGradient id='orange' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#f7941d'/>
      <stop offset='100%' stop-color='#ff5e36'/>
    </linearGradient>
  </defs>
  <rect width='600' height='400' rx='12' fill='url(#bgGrad)'/>
  <circle cx='500' cy='80' r='120' fill='#ffffff' opacity='0.05'/>
  <circle cx='100' cy='320' r='160' fill='#ffffff' opacity='0.05'/>
  
  <!-- Machinery Diagram Box -->
  <g transform='translate(150, 60)'>
    <rect x='0' y='0' width='300' height='220' rx='16' fill='#0f172a' stroke='#f7941d' stroke-width='3'/>
    <rect x='30' y='30' width='240' height='30' rx='6' fill='#00c6ff' opacity='0.8'/>
    <rect x='30' y='75' width='240' height='30' rx='6' fill='#00c6ff' opacity='0.8'/>
    <path d='M20 20 H280 V200 H20 Z' fill='none' stroke='#94a3b8' stroke-width='3'/>
    <circle cx='60' cy='155' r='16' fill='#1a2a6c' stroke='#f7941d' stroke-width='2'/>
    <circle cx='110' cy='155' r='16' fill='#1a2a6c' stroke='#00c6ff' stroke-width='2'/>
    <rect x='160' y='135' width='110' height='40' rx='6' fill='#1e293b' stroke='#ffffff'/>
    <text x='215' y='160' font-family='Arial' font-size='12' fill='#f7941d' font-weight='bold' text-anchor='middle'>KANGAROO</text>
  </g>

  <!-- Title Banner -->
  <g transform='translate(30, 310)'>
    <text x='0' y='25' font-family='Arial' font-size='24' font-weight='bold' fill='#ffffff'>Kangaroo NXT Fully Auto</text>
    <text x='0' y='50' font-family='Arial' font-size='15' fill='#f7941d' font-weight='600'>Rs. 1,75,000 + GST</text>
